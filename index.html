<script>
  // Web build: offline cache + updates. A new version takes over at once; the page then
  // offers a reload (app.js PREP_UPDATED). Checks for updates whenever the app comes back.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then((reg) => {
      document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) window.PREP_UPDATED?.(); });
  }
</script>
